<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>💗 真心话大冒险</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --pink: #ff5b8a;
    --pink-2: #ff7fa6;
    --pink-deep: #c8326b;
    --pink-deep-2: #e0467c;
    --pink-light: #ffd6e2;
    --pink-bg: #ffe3ec;
    --peach: #ff9a76;
    --peach-2: #ffb997;
    --bg: #fff0f4;
    --card: #ffffff;
    --text: #4a2a36;
    --muted: #d58aa1;
    --muted-2: #e7a9bb;
    --danger: #ff5a5f;
    --line: #ffe7ee;
    --ok: #46c48a;
    --shadow-card: 0 8px 30px rgba(255, 91, 138, 0.10);
    --shadow-pop: 0 14px 40px rgba(255, 91, 138, 0.28);
  }
  html, body {
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    color: var(--text);
    font-size: 16px; line-height: 1.5;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body {
    max-width: 480px; margin: 0 auto; min-height: 100vh;
    padding: 22px 16px calc(28px + env(safe-area-inset-bottom));
    background:
      radial-gradient(circle at 15% -2%, #ffdce6 0%, transparent 42%),
      radial-gradient(circle at 92% 6%, #ffe6cf 0%, transparent 38%),
      radial-gradient(circle at 80% 40%, #ffeaf0 0%, transparent 30%),
      var(--bg);
    background-attachment: fixed;
  }

  /* ===== 顶部 ===== */
  .hero { padding: 10px 4px 22px; text-align: center; position: relative; }
  .hero .float {
    position: absolute; font-size: 22px; opacity: .55; user-select: none;
    animation: floaty 4s ease-in-out infinite;
  }
  .hero .float.f1 { left: 8px; top: 6px; animation-delay: 0s; }
  .hero .float.f2 { right: 12px; top: 26px; animation-delay: 1.2s; }
  .hero .float.f3 { left: 40%; top: 0; animation-delay: 2.4s; font-size: 18px; }
  @keyframes floaty { 0%,100%{transform:translateY(0) rotate(-6deg)} 50%{transform:translateY(-7px) rotate(6deg)} }
  .hero h1 {
    font-size: 32px; font-weight: 900; letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--pink-deep), var(--peach));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 0 #fff);
  }
  .hero .badge {
    display: inline-block; font-size: 11.5px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--pink), var(--peach));
    padding: 4px 14px; border-radius: 999px; margin-top: 10px;
    box-shadow: 0 4px 12px rgba(255, 91, 138, 0.30);
    letter-spacing: 0.5px;
  }
  .hero p { font-size: 14px; color: var(--muted); margin-top: 10px; }

  /* ===== 结果卡 ===== */
  .result {
    background: linear-gradient(165deg, #fff, #fff5f9 55%, #ffeef4);
    border: 2px solid #fff;
    border-radius: 26px; text-align: center; padding: 34px 20px;
    box-shadow: var(--shadow-card), inset 0 0 0 1.5px var(--pink-light);
    position: relative; overflow: hidden;
  }
  .result::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(255,182,205,0.45), transparent 60%);
    pointer-events: none;
  }
  .result > * { position: relative; }
  .result .label {
    font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 3px;
    text-transform: uppercase; transition: opacity .25s ease;
  }
  .result .label .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--pink); margin: 0 2px 1px; vertical-align: middle; }
  .result .dice-wrap {
    position: relative; width: 100%; height: 0; overflow: hidden;
    transition: height .28s ease;
  }

  .result.rolling .dice-wrap { height: 150px; }
  .result.rolling .dice { animation: spinSlow 1.4s linear infinite, diceRoll .5s steps(1) infinite; }
  .result:not(.rolling) .dice { animation: none; }

  .result .text {
    font-size: 30px; font-weight: 800; color: var(--pink-deep);
    margin-top: 16px; min-height: 44px; line-height: 1.4;
    word-break: break-word; opacity: 1;
    transition: opacity .35s ease .05s;
  }
  .result.rolling .text { opacity: 0; }
  .result .meta { font-size: 13px; color: var(--muted-2); margin-top: 16px; transition: opacity .25s ease; }
  .result.rolling .meta { opacity: 0; }

  /* 字幕从骰子中弹出 */
  @keyframes emerge {
    0%   { opacity: 0; transform: translate(-50%, -28%) scale(.35); }
    55%  { opacity: 1; transform: translate(-50%, -56%) scale(1.05); }
    78%  { transform: translate(-50%, -50%) scale(.985); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .text-bubble {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(1);
    width: 84%; pointer-events: none; opacity: 0;
    font-size: 32px; font-weight: 800; color: var(--pink-deep);
    line-height: 1.4; word-break: break-word; text-align: center;
    background: rgba(255, 255, 255, 0.96);

    box-shadow: var(--shadow-pop), inset 0 0 0 1.5px #fff;
    z-index: 5;
  }
  .text-bubble::after {
    content: ''; position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%) rotate(45deg);
    width: 18px; height: 18px; background: rgba(255,255,255,0.96); border-radius: 3px;
    box-shadow: 6px 6px 12px rgba(255,91,138,0.12);

  .result.show-bubble .text-bubble { opacity: 1; animation: emerge .55s cubic-bezier(.22,.9,.3,1) forwards; }

  /* ===== 按钮 ===== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;

    font-size: 16px; font-weight: 600; font-family: inherit;
    padding: 16px 26px; transition: transform .08s, opacity .15s, box-shadow .2s;
    white-space: nowrap; position: relative;
  }
  .btn:active { transform: scale(0.965); opacity: .9; }
  .btn-primary {
    width: 100%; padding: 18px 0; font-size: 19px; color: #fff;
    background: linear-gradient(135deg, var(--pink) 0%, var(--peach) 100%);
    box-shadow: 0 12px 28px rgba(255, 91, 138, 0.40), inset 0 1.5px 0 rgba(255,255,255,0.45);
  }
  .btn-primary:active { box-shadow: 0 6px 16px rgba(255, 91, 138, 0.40); }
  .btn-primary .spark { font-size: 20px; }
  .btn-ghost {
    background: #fff; color: var(--pink-deep); font-weight: 700;
    box-shadow: 0 4px 14px rgba(255, 91, 138, 0.10), inset 0 0 0 1.5px var(--pink-light);
  }
  .btn-ghost:active { background: var(--pink-bg); }
  .btn-sm { padding: 11px 16px; font-size: 14px; border-radius: 999px; }
  .btn:disabled { opacity: .5; filter: grayscale(.2); cursor: not-allowed; }

  .group { margin-top: 26px; text-align: center; }
  .row2 { margin-top: 14px; display: flex; gap: 12px; justify-content: center; }
  .row2 .btn { flex: 1; }

  /* ===== 区块 ===== */
  .section { margin-top: 38px; }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 19px; font-weight: 800; color: var(--pink-deep);
    display: flex; align-items: center; gap: 8px;
  }
  .section-title .ic {
    width: 30px; height: 30px; border-radius: 10px; display: inline-flex;
    align-items: center; justify-content: center; font-size: 16px;
    background: linear-gradient(135deg, var(--pink-bg), #fff);
    box-shadow: inset 0 0 0 1.5px var(--pink-light);
  }
  .section-title .cnt {
    font-size: 12px; font-weight: 700; color: var(--muted);
    background: var(--pink-bg); padding: 3px 10px; border-radius: 999px; margin-left: 2px;
  }
  .section-title .cnt b { color: var(--pink-deep); }

  /* ===== 任务列表 ===== */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item {
    display: flex; align-items: center; background: #fff; border-radius: 18px;
    padding: 14px 14px; box-shadow: 0 4px 14px rgba(255, 91, 138, 0.07);
    transition: background .2s, transform .15s;
    box-shadow: 0 4px 14px rgba(255, 91, 138, 0.07), inset 0 0 0 1.5px #fff;
  }
  .item.picked { background: linear-gradient(135deg, #fff5f8, #ffe9f0); }
  .item.picked .idx { background: var(--pink-light); color: var(--pink-deep); }
  .item .idx {
    width: 32px; height: 32px; border-radius: 11px; flex-shrink: 0;
    background: linear-gradient(135deg, #fff, var(--pink-bg));
    color: var(--pink-deep-2); font-size: 13px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    margin-right: 14px; box-shadow: inset 0 0 0 1.5px var(--pink-light);
  }
  .item .w { flex: 1; font-size: 16px; word-break: break-word; color: #5a3545; }
  .item.picked .w { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted-2); }
  .item .tag {
    font-size: 11px; font-weight: 700; color: var(--pink-deep);
    background: var(--pink-light); border-radius: 999px; padding: 4px 10px; margin-right: 10px;
  }
  .item .del {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    background: #fbeeee; color: var(--danger); font-size: 13px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer; transition: background .15s, transform .1s;
  }
  .item .del:active { background: #ffdada; transform: scale(.9); }

  /* 空状态 */
  .empty {
    text-align: center; background: #fff; border-radius: 22px; padding: 46px 22px;
    box-shadow: 0 4px 14px rgba(255, 91, 138, 0.07), inset 0 0 0 1.5px #fff;
  }
  .empty .emo { font-size: 52px; }
  .empty .t { font-size: 16px; color: #c27b8e; margin-top: 12px; font-weight: 700; }
  .empty .s { font-size: 13px; color: var(--muted); margin-top: 6px; }

  /* ===== 历史 ===== */
  .history {
    background: #fff; border-radius: 22px; padding: 6px 18px;
    box-shadow: 0 4px 14px rgba(255, 91, 138, 0.07), inset 0 0 0 1.5px #fff;
  }
  .history .h-item {
    display: flex; align-items: center; padding: 13px 0;
    border-bottom: 1px dashed var(--line);
  }
  .history .h-item:last-child { border-bottom: none; }
  .history .h-num {
    width: 34px; height: 34px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--pink-bg), #fff);
    color: var(--pink-deep); font-size: 12px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    margin-right: 14px; box-shadow: inset 0 0 0 1.5px var(--pink-light);
  }
  .history .h-t { flex: 1; font-size: 15px; color: #8a5a6a; }
  .history .h-t .h-when { display: block; font-size: 11px; color: #d6a6b6; margin-top: 2px; font-weight: 500; }

  /* 历史操作行 */
  .history-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .history-bar .clear {
    font-size: 12.5px; font-weight: 700; color: var(--danger); background: #fff5f6;
    border: none; padding: 7px 14px; border-radius: 999px; cursor: pointer;
    box-shadow: inset 0 0 0 1.5px #ffdada;
  }

  .footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 44px; line-height: 1.8; }

  /* ===== 弹窗 ===== */
  .mask {
    position: fixed; inset: 0; background: rgba(90, 25, 55, 0.55);
    opacity: 0; pointer-events: none; transition: opacity .25s;
    z-index: 100; backdrop-filter: blur(2px);
  }
  .mask.show { opacity: 1; pointer-events: auto; }
  .popup {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #fff; border-radius: 30px 30px 0 0;
    padding: 26px 20px calc(26px + env(safe-area-inset-bottom));
    z-index: 101; max-width: 480px; margin: 0 auto;
    transform: translateY(100%); transition: transform .3s cubic-bezier(.3,.8,.25,1);
    box-shadow: 0 -10px 40px rgba(90,25,55,0.18);
  }
  .popup.show { transform: translateY(0); }
  .popup .bar { width: 40px; height: 4.5px; border-radius: 999px; background: var(--pink-light); margin: 0 auto 18px; }
  .popup h3 { font-size: 21px; font-weight: 900; color: var(--pink-deep); }
  .popup .sub { font-size: 13px; color: var(--muted); margin-top: 6px; margin-bottom: 16px; }
  .popup textarea {
    width: 100%; min-height: 160px; background: #fff7f9; border-radius: 18px;
    padding: 15px; font-size: 16px; font-family: inherit; line-height: 1.65;
    border: none; resize: vertical; outline: none; box-sizing: border-box; color: var(--text);
    box-shadow: inset 0 0 0 1.5px var(--pink-light);
  }
  .popup textarea::placeholder { color: #e0b3c2; }
  .popup textarea:focus { box-shadow: inset 0 0 0 2px var(--pink); }
  .popup .actions { display: flex; gap: 12px; margin-top: 18px; }
  .popup .actions .btn { flex: 1; }

  .toast {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.85);
    background: rgba(90, 25, 55, 0.94); color: #fff; backdrop-filter: blur(6px);
    padding: 15px 26px; border-radius: 16px; font-size: 15px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: all .22s cubic-bezier(.2,.9,.3,1);
    z-index: 200; max-width: 78%; text-align: center; line-height: 1.5;
    box-shadow: 0 12px 34px rgba(90,25,55,0.35);
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .toast.ok { background: linear-gradient(135deg, var(--pink-deep), var(--peach)); }

  /* 自定义确认弹窗 */
  .cf-mask {
    position: fixed; inset: 0; background: rgba(90,25,55,0.5);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 300;
    display: flex; align-items: center; justify-content: center; padding: 30px;
  }
  .cf-mask.show { opacity: 1; pointer-events: auto; }
  .cf-box {
    width: 100%; max-width: 320px; background: #fff; border-radius: 24px;
    padding: 26px 22px 20px; text-align: center;
    transform: scale(.85); transition: transform .22s cubic-bezier(.2,.9,.3,1);
    box-shadow: 0 20px 50px rgba(90,25,55,0.3);
  }
  .cf-mask.show .cf-box { transform: scale(1); }
  .cf-box .cf-ic { font-size: 42px; margin-bottom: 8px; }
  .cf-box .cf-t { font-size: 16.5px; font-weight: 800; color: var(--pink-deep); line-height: 1.5; }
  .cf-box .cf-s { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
  .cf-box .cf-actions { display: flex; gap: 10px; margin-top: 20px; }
  .cf-box .cf-actions .btn { flex: 1; padding: 13px 0; font-size: 15px; }
</style>
</head>

  <div class="hero">

  <!-- 添加弹窗 -->
  <div class="mask" id="mask"></div>

    <div class="actions">

        <button class="btn btn-ghost" id="cfCancel">取消</button>
        <button class="btn btn-primary" id="cfOk">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

    '💌 对在场的人说一句真心话，不许说客套话',
    '⏱️ 30 秒内说出 5 个你暗恋过的人（可以是明星）'
  ];

  var state = { list: [], history: [] };

  /* ===== 存储（带失败提示） ===== */
  var storeOK = true;
  function load() {
    var list = null, history = [];
    try { list = JSON.parse(localStorage.getItem(STORE)); } catch (e) {}
    if (!list || !Array.isArray(list) || !list.length) {
      list = DEFAULTS.map(function (t) { return { text: t, picked: false }; });
      saveList();
    }
    try { history = JSON.parse(localStorage.getItem(HISTORE)) || []; } catch (e) {}
    state.list = list;
    state.history = Array.isArray(history) ? history : [];
  }
  function saveList() {
    try { localStorage.setItem(STORE, JSON.stringify(state.list)); storeOK = true; }
    catch (e) { storeOK = false; }
  }
  function saveHistory() {
    try { localStorage.setItem(HISTORE, JSON.stringify(state.history)); storeOK = true; }
    catch (e) { storeOK = false; }
  }

  /* ===== 提示 ===== */
  var toastTimer;
  function toast(msg, ok) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast' + (ok ? ' ok' : '');
    requestAnimationFrame(function () { el.classList.add('show'); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1700);
  }

  /* ===== 自定义确认弹窗（替代原生 confirm） ===== */
  var cfOkBtn = document.getElementById('cfOk');
  var cfCancelBtn = document.getElementById('cfCancel');
  var cfResolve = null;
  function confirmPop(title, sub, ic) {
    document.getElementById('cfTitle').textContent = title;
    document.getElementById('cfSub').textContent = sub || '';
    document.getElementById('cfIc').textContent = ic || '💗';
    document.getElementById('cfMask').classList.add('show');
    return new Promise(function (resolve) {
      cfResolve = function (v) { resolve(v); };
    });
  }
  cfOkBtn.addEventListener('click', function () {
    document.getElementById('cfMask').classList.remove('show');
    if (cfResolve) { cfResolve(true); cfResolve = null; }
  });
  cfCancelBtn.addEventListener('click', function () {
    document.getElementById('cfMask').classList.remove('show');
    if (cfResolve) { cfResolve(false); cfResolve = null; }
  });

  /* ===== 渲染 ===== */
  function render() {
    var list = state.list;
    document.getElementById('count').textContent = list.length;
    document.getElementById('meta').textContent =
      '共 ' + list.length + ' 条任务 · 已抽 ' + state.history.length + ' 次';

    var wrap = document.getElementById('listWrap');
    if (!list.length) {
      wrap.innerHTML =
        '<div class="empty">' +
          '<div class="emo">📭</div>' +
          '<div class="t">任务库还是空的</div>' +
          '<div class="s">点击右上角「添加」开始录入挑战</div>' +
        '</div>';
    } else {
      var html = '<div class="list">';
      for (var i = 0; i < list.length; i++) {
        var it = list[i];
        html += '<div class="item' + (it.picked ? ' picked' : '') + '">' +
          '<div class="idx">' + (i + 1) + '</div>' +
          '<div class="w">' + escapeHtml(it.text) + '</div>' +
          (it.picked ? '<div class="tag">已抽</div>' : '') +
          '<button class="del" data-i="' + i + '" aria-label="删除">✕</button>' +
        '</div>';
      }
      html += '</div>';
      wrap.innerHTML = html;
    }

    // 历史
    var hs = document.getElementById('historySection');
    var hb = document.getElementById('historyBox');
    if (state.history.length) {
      hs.style.display = '';
      var hhtml = '';
      for (var j = 0; j < state.history.length; j++) {
        var h = state.history[j];
        hhtml += '<div class="h-item">' +
          '<div class="h-num">' + (j + 1) + '</div>' +
          '<div class="h-t">' + escapeHtml(h.text) +
            '<span class="h-when">' + formatTime(h.time) + '</span></div>' +
        '</div>';
      }
      hb.innerHTML = hhtml;
    } else {
      hs.style.display = 'none';
    }
  }

  function formatTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var now = new Date();
    var sameDay = d.getFullYear() === now.getFullYear() &&
                  d.getMonth() === now.getMonth() &&
                  d.getDate() === now.getDate();
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    if (sameDay) return '今天 ' + hh + ':' + mm;
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hh + ':' + mm;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
